<style>
/* Takwim KMB — tema JEJAK JSS (korporat): biru laut institusi, merah lambang kolej, kertas sejuk, Plus Jakarta Sans. */
:root{
  --ivory:#F2F5FA; --sand:#EAEFF7; --stone:#E4EAF3; --oat:#D3DDEE; --white:#FFFFFF;
  --ink:#0E1B33; --ink2:#33425E; --muted:#5B6983; --faint:#8794AB;
  --line:#DCE3EE; --line2:#C6D0E0; --line3:#E6EBF3;
  --accent:#1F5FAE; --accent-tint:rgba(31,95,174,.09); --accent-dark:#164A8A;
  --navy:#0F2247; --navy2:#16315F; --crimson:#B3222B; --crimson-lt:#E0444D;
  --danger:#B3261E; --danger-tint:#FBEAE8;
  --hover:rgba(15,34,71,.05); --active:rgba(15,34,71,.09);
  --holiday:#FCEEF2; --weekend:#F7F9FC;
  --sans:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --shadow:0 1px 2px rgba(15,34,71,.05),0 4px 14px -6px rgba(15,34,71,.10);
  --shadow-lg:0 24px 60px -20px rgba(15,34,71,.35),0 2px 8px rgba(15,34,71,.08);
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Rangka ── */
.app{display:flex;min-height:100vh}
.side{flex:0 0 264px;background:linear-gradient(180deg,#12285A 0%,#0C1B3D 100%);color:#C9D4EA;padding:22px 14px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px}
.mark{flex:none;width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px -2px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.16);overflow:hidden;padding:4px}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-name{font-size:18.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:#fff}
.brand-sub{font-size:11.5px;line-height:1.35;color:#8FA2C6}
.nav{display:flex;flex-direction:column;gap:3px}
.navbtn{appearance:none;position:relative;display:flex;align-items:center;gap:12px;border:0;border-radius:9px;padding:9px 12px;min-height:42px;background:transparent;font-size:14px;font-weight:600;text-align:left;color:#C3CFE6}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.navbtn[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.navbtn[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--crimson-lt)}
.navbtn svg{flex:none;opacity:.9}
.side-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7F93BA;padding:0 12px 8px;display:flex;justify-content:space-between;align-items:center}
.side-h button{appearance:none;border:0;background:none;color:#9FB1D3;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;padding:2px 4px;border-radius:5px}
.side-h button:hover{color:#fff;background:rgba(255,255,255,.08)}
.cats{display:flex;flex-direction:column;gap:2px}
.catbtn{appearance:none;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:#D5DEEF;text-align:left;min-height:36px}
.catbtn:hover{background:rgba(255,255,255,.07)}
.catbtn .sw{flex:none;width:16px;height:16px;border-radius:5px;border:2px solid var(--c);background:var(--c);display:grid;place-items:center;transition:background .15s}
.catbtn .sw svg{opacity:1}
.catbtn[aria-pressed="false"]{color:#7F8FAE}
.catbtn[aria-pressed="false"] .sw{background:transparent}
.catbtn[aria-pressed="false"] .sw svg{opacity:0}
.catbtn .n{margin-left:auto;font-size:12px;color:#8FA2C6;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.who-l{font-size:11px;color:#8FA2C6;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.who-n{font-size:13.5px;color:#fff;font-weight:700;line-height:1.3}
.sbtn{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#E3EAF7;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.sbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.legal{font-size:11px;color:#6E82A9;padding:0 8px;line-height:1.45}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(242,245,250,.88);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:16px 28px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ttl{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ttl h1{margin:0;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.ttl .sub{font-size:13px;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--white);border:1px solid var(--line);color:var(--ink2)}
.pill.t{background:var(--navy);border-color:var(--navy);color:#fff}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line2);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.ib{appearance:none;border:0;background:transparent;border-radius:7px;min-width:34px;height:32px;display:grid;place-items:center;color:var(--ink2);padding:0 10px;font-size:13.5px;font-weight:600}
.ib:hover{background:var(--hover);color:var(--ink)}
.btn{appearance:none;border:1px solid var(--line2);background:var(--white);border-radius:10px;height:40px;padding:0 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--oat);background:#FBFCFE}
.btn.pri{background:var(--crimson);border-color:var(--crimson);color:#fff;box-shadow:0 6px 16px -8px rgba(179,34,43,.7)}
.btn.pri:hover{background:#9C1C24}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy2)}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover)}
.btn.dng{color:var(--danger);border-color:#EBC4C0}
.btn.dng:hover{background:var(--danger-tint)}
.btn:disabled{opacity:.55;pointer-events:none}
.search{position:relative}
.search input{width:240px;height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--white);padding:0 34px 0 36px;font-size:14px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.search>svg{position:absolute;left:11px;top:11px;color:var(--faint);pointer-events:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .x{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--faint);display:grid;place-items:center}
.search .x:hover{background:var(--hover);color:var(--ink)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:46px;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:230px;z-index:40}
.menu button{appearance:none;border:0;background:none;display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink)}
.menu button:hover{background:var(--hover)}
.menu small{display:block;color:var(--muted);font-size:11.5px}

.content{padding:22px 28px 60px;flex:1}
.aud{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--sand);color:var(--ink2);border:1px solid var(--line)}
.aud.y1{background:#E6F0FF;color:#1F4E8C;border-color:#C9DBF5}.aud.y2{background:#FFF0E0;color:#8A4B0B;border-color:#F3D7B5}.aud.st{background:#EFE8FA;color:#5B3B91;border-color:#DCCDF2}
.cdn{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--navy);color:#fff}
.cdn.soon{background:var(--crimson)}.cdn.now{background:#2A9174}.cdn.past{background:var(--stone);color:var(--faint)}
.copycal{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--ivory);border:1px solid var(--line3)}
.copycal .lbl{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.copycal .row{display:flex;flex-wrap:wrap;gap:8px}
.copycal a,.copycal button{appearance:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--white);font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;cursor:pointer}
.copycal a:hover,.copycal button:hover{border-color:var(--accent)}
.copycal i{width:10px;height:10px;border-radius:3px;display:inline-block}
.newtag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--crimson-lt);color:#fff;border-radius:5px;padding:1px 5px;margin-left:auto}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
.card h3{margin:0 0 2px;font-size:16px;font-weight:800}
.card .cs{font-size:13px;color:var(--muted);margin-bottom:14px}
.ck{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
.seg2{display:flex;flex-wrap:wrap;gap:6px}
.seg2 button{appearance:none;border:1.5px solid var(--line2);background:var(--white);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.verdict{border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.verdict .vi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800}
.verdict h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.verdict p{margin:4px 0 0;font-size:13.5px}
.verdict.ok{background:#E3F4EC;border:1px solid #B9E2CD;color:#14523A}.verdict.ok .vi{background:#2A9174}
.verdict.mid{background:#FFF6E2;border:1px solid #F1DBA6;color:#6B4A07}.verdict.mid .vi{background:#C2720C}
.verdict.bad{background:#FDECEB;border:1px solid #F3C4C0;color:#7A1A14}.verdict.bad .vi{background:#B3261E}
.reason{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line3);font-size:13.5px}
.reason:first-child{border-top:0}
.reason .dot{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{appearance:none;border:1.5px solid #B9E2CD;background:#F1FAF5;color:#14523A;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;text-align:left;line-height:1.25}
.sugg button small{display:block;font-weight:600;color:#4C7A65;font-size:11.5px}
.sugg button:hover{border-color:#2A9174}
.wkstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.wkstrip button{appearance:none;border:1px solid var(--line);background:var(--ivory);border-radius:10px;padding:8px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2)}
.wkstrip button b{display:block;font-size:18px;color:var(--ink)}
.wkstrip button.sel{border:2px solid var(--navy);background:#fff}
.wkstrip button.hol{background:var(--holiday);color:var(--crimson)}
.wkstrip button .n{display:block;font-size:10.5px;font-weight:700;margin-top:2px}
.wkstrip button .n.r{color:#B3261E}.wkstrip button .n.a{color:#C2720C}.wkstrip button .n.g{color:#2A9174}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.dli{appearance:none;border:1px solid var(--line);background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.dli:hover{border-color:var(--oat)}
.dli .num{flex:none;width:62px;height:62px;border-radius:14px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dli .num b{font-size:22px;line-height:1}.dli .num span{font-size:10px;font-weight:700;opacity:.8;margin-top:3px}
.dli.soon .num{background:var(--crimson)}
.dli.past{opacity:.5}
.dli .tt{font-size:14.5px;font-weight:800;line-height:1.3}
.dli .mt{font-size:12.5px;color:var(--muted);margin-top:3px}
.hl{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FCEEF2,#fff);border:1px solid #F2C9D5;border-radius:16px;padding:16px 18px;margin-bottom:18px}
.hl .big{font-size:36px;font-weight:800;color:var(--crimson);line-height:1}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;font-size:14px;line-height:1.5}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.url{display:flex;gap:8px;align-items:center;background:var(--ivory);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;margin:10px 0 14px}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width: 900px){ .ck,.sub2{grid-template-columns:1fr} }
.credit{text-align:center;padding:10px 20px 34px;color:var(--muted);font-size:13px;line-height:1.5}
.credit img{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto 10px}
.credit b{display:block;color:var(--ink);font-size:14px;font-weight:700}
.credit span{display:block}
@media (max-width: 900px){ .content{padding-bottom:16px} .credit{padding-bottom:110px} }
@media print{ .credit{display:none} }
.notice{display:block;background:#FFF7E6;border:1px solid #F1DDB0;color:#6B4A07;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}

/* ── Paparan bulan ── */
.cal{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.dow{display:grid;grid-template-columns:64px repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--sand)}
.dow div{padding:10px 10px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dow div:first-child{text-align:center;font-size:10.5px}
.wk{display:grid;grid-template-columns:64px 1fr;border-bottom:1px solid var(--line3)}
.wk:last-child{border-bottom:0}
.wkl{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:10px 4px;border-right:1px solid var(--line3);background:#FAFBFD}
.wkl .m{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em}
.wkl .w{font-size:17px;font-weight:800;color:var(--ink);line-height:1}
.wkl .r{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--navy);color:#fff}
.wkl .r.t2{background:var(--crimson)}
.wg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:22px;row-gap:3px;position:relative;min-height:136px}
.dc{grid-row:1 / -1;border-right:1px solid var(--line3);position:relative;cursor:pointer;min-height:136px}
.dc:nth-child(7){border-right:0}
.dc:hover{background:var(--hover)}
.dc.we{background:var(--weekend)}
.dc.hol{background:var(--holiday)}
.dc.out .dn{color:#B6C0D2}
.dn{position:absolute;top:6px;left:8px;font-size:13px;font-weight:700;color:var(--ink2);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.dc.today .dn{background:var(--crimson);color:#fff}
.dc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.bar{appearance:none;border:0;position:relative;z-index:2;margin:0 4px;height:22px;border-radius:6px;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 14%,white);color:color-mix(in srgb,var(--c) 70%,#0E1B33);border-left:3px solid var(--c);min-width:0}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar:hover{background:color-mix(in srgb,var(--c) 24%,white)}
.bar.multi{background:var(--c);color:#fff;border-left-color:rgba(0,0,0,.18)}
.bar.multi:hover{filter:brightness(.94)}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;border-left-width:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.more{appearance:none;border:0;background:none;z-index:2;font-size:11.5px;font-weight:700;color:var(--accent);text-align:left;padding:0 10px;height:22px}
.more:hover{text-decoration:underline}
.dots{display:none}

/* ── Senarai ── */
.agenda{display:flex;flex-direction:column;gap:10px;max-width:920px}
.ag-m{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px}
.agenda .ag-m{position:sticky;top:81px;z-index:6;background:rgba(242,245,250,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:6px -6px 0;padding:10px 6px 8px;border-bottom:1px solid var(--line)}
.ag-date .mo{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--crimson);margin-bottom:3px}
.ag-d.today .ag-date .mo{color:#FFD9DC}
@media (max-width: 900px){ .agenda .ag-m{top:64px} }
.ag-m h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.ag-m span{font-size:12.5px;color:var(--muted);font-weight:600}
.ag-d{display:grid;grid-template-columns:72px 1fr;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.ag-d.today{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(179,34,43,.10),var(--shadow)}
.ag-date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--sand);padding:8px 4px;align-self:start}
.ag-date .d{font-size:24px;font-weight:800;line-height:1}
.ag-date .w{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.ag-d.today .ag-date{background:var(--crimson);color:#fff}
.ag-d.today .ag-date .w{color:#FFD9DC}
.ag-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev{appearance:none;border:0;background:transparent;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:6px 10px;border-radius:10px;width:100%}
.ev:hover{background:var(--hover)}
.ev .cb{flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.ev .tx{min-width:0;flex:1;display:block}
.ev .tt{display:block}
.ev .mt{align-items:center}
.ev .tt{font-size:14.5px;font-weight:700;line-height:1.35}
.ev .mt{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 13%,white);color:color-mix(in srgb,var(--c) 75%,#0E1B33)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--white);border:1px dashed var(--line2);border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ── Tahun ── */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mm{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:var(--shadow)}
.mm-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mm-h button{appearance:none;border:0;background:none;padding:0;font-size:15px;font-weight:800;color:var(--ink)}
.mm-h button:hover{color:var(--crimson)}
.mm-h span{font-size:11.5px;color:var(--muted);font-weight:600}
.mm-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mm-g .h{font-size:10px;font-weight:700;color:var(--faint);text-align:center;padding-bottom:3px}
.md{appearance:none;border:0;background:transparent;aspect-ratio:1;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.md:hover{background:var(--hover)}
.md.we{color:var(--faint)}
.md.hol{background:var(--holiday);color:var(--crimson)}
.md.today{background:var(--crimson);color:#fff}
.md i{display:flex;gap:2px;height:4px}
.md i b{width:4px;height:4px;border-radius:50%;background:var(--c)}
.md.today i b{background:#fff}
.md.blank{visibility:hidden}

/* ── Panel / dialog ── */
.scrim{position:fixed;inset:0;background:rgba(14,27,51,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.dlg{background:var(--white);border-radius:18px;box-shadow:var(--shadow-lg);width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;animation:pop .18s ease}
.dlg.sm{width:min(380px,100%)}
.dlg-h{padding:20px 22px 0;display:flex;gap:12px;align-items:flex-start}
.dlg-h h3{margin:0;font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.01em;flex:1;min-width:0;word-wrap:break-word}
.dlg-x{flex:none;appearance:none;border:0;background:var(--sand);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.dlg-x:hover{background:var(--stone)}
.dlg-b{padding:14px 22px 6px}
.dlg-f{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ev-strip{height:8px;background:var(--c)}
.facts{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
.fact{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.fact svg{flex:none;color:var(--faint);margin-top:2px}
.fact .k{font-weight:700}
.fact .s{color:var(--muted);font-size:12.5px}
.ket{white-space:pre-wrap;background:var(--ivory);border:1px solid var(--line3);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink2)}
.byline{font-size:11.5px;color:var(--faint);margin-top:12px}
.confirm{background:var(--danger-tint);border:1px solid #EBC4C0;border-radius:12px;padding:12px;font-size:13.5px;color:#7A1A14;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line2);border-radius:10px;background:var(--white);padding:10px 12px;font-size:14.5px;min-height:44px}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{appearance:none;border:1.5px solid var(--line2);background:var(--white);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--ink2)}
.catpick button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.catpick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px}
.pin{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.pin input{width:100%;text-align:center;letter-spacing:.5em;font-size:24px;font-weight:800;height:56px;border:1.5px solid var(--line2);border-radius:12px}
.pin input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,34,71,.12)}
.lock{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,#16315F,#0C1B3D);color:#fff;display:grid;place-items:center;margin:0 auto 4px}
.daylist{display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:120;display:flex;gap:10px;align-items:center;animation:pop .2s ease;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--danger)}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
.spin.dk{border-color:var(--line2);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;gap:12px;padding:80px 0;color:var(--muted);font-size:14px}

/* ── Mudah alih ── */
.mtop,.bnav{display:none}
@media (max-width: 900px){
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px);padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(180deg,#12285A,#0C1B3D);color:#fff;position:sticky;top:0;z-index:30}
  .mtop .mark{width:40px;height:40px;border-radius:11px;padding:3px}
  .mtop .brand-name{font-size:16px}
  .mtop .sbtn{margin-left:auto;padding:7px 10px;font-size:12.5px}
  .top{position:static;padding:14px 16px 12px;gap:10px;background:var(--ivory);backdrop-filter:none}
  .ttl h1{font-size:21px}
  .ctl{width:100%}
  .search{flex:1}
  .search input{width:100%}
  .content{padding:14px 12px 110px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
  .bnav button{appearance:none;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:10px}
  .bnav button[aria-current="page"]{color:var(--crimson)}
  .bnav button[aria-current="page"] svg{stroke:var(--crimson)}
  .fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:55;width:56px;height:56px;border-radius:18px;border:0;background:var(--crimson);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(179,34,43,.8)}
  .top .btn.pri{display:none}
}
@media (min-width: 901px){ .fab{display:none} }
@media (max-width: 720px){
  .dow{grid-template-columns:repeat(7,1fr)}
  .dow div{padding:8px 0;text-align:center;font-size:10.5px;letter-spacing:.02em}
  .dow div:first-child{display:none}
  .wk{grid-template-columns:1fr;position:relative}
  .wkl{display:none}
  .wg{grid-auto-rows:auto;row-gap:0;min-height:0}
  .bar,.more{display:none}
  .dc{min-height:64px;margin:0}
  .dn{left:50%;transform:translateX(-50%);top:14px;font-size:13px}
  .dots{display:flex;position:absolute;left:0;right:0;bottom:8px;justify-content:center;gap:3px}
  .dots b{width:6px;height:6px;border-radius:50%;background:var(--c)}
  .wk .wtag{position:absolute;left:4px;top:2px;font-size:8.5px;font-weight:800;color:var(--faint);z-index:3;pointer-events:none}
  .daypanel{margin-top:14px}
  .ag-d{grid-template-columns:58px 1fr;gap:10px;padding:10px}
  .ag-date .d{font-size:21px}
  .scrim{align-items:end;padding:0}
  .dlg,.dlg.sm{width:100%;border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom)}
  .row2{grid-template-columns:1fr}
  .year{grid-template-columns:1fr 1fr;gap:10px}
  .mm{padding:10px 8px}
  .md{font-size:10px;border-radius:5px}
  .md i b{width:3px;height:3px}
}
@media (min-width: 721px){ .wtag,.daypanel{display:none} }
@media (max-width: 420px){ .year{grid-template-columns:1fr} }

@media print{
  .side,.mtop,.bnav,.fab,.ctl,.notice{display:none!important}
  .top{position:static;border:0;padding:0 0 10px;background:none}
  .content{padding:0}
  body,html{background:#fff}
  .cal,.mm,.ag-d{box-shadow:none}
  .bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dc,.wkl .r,.chip,.md{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:10mm}
}
</style>

  function words() { return S.q.toLowerCase().split(/\s+/).filter(Boolean); }
  // Extra words so searches like "ib may exam starts" find "IB M27 BEGINS".
  function synonyms(t) {

    return set;
  }

  /* ═════════════ Rangka UI ═════════════ */
  var VIEWS = [['bulan', 'Calendar'], ['senarai', 'Events'], ['tarikh', 'Countdown'], ['semak', 'Check a date'], ['tahun', 'Year']];
  function renderChrome() {
    var t = S.data.tetapan;
    $$('[data-nama]').forEach(function (e) { e.textContent = t.nama.replace(/\s*\d{4}$/, '') || 'KMB Calendar'; });
    $$('[data-sub]').forEach(function (e) { e.textContent = t.subtajuk + ' · ' + t.tahun; });
    document.title = t.nama;

    $('[data-nav]').innerHTML = VIEWS.map(function (v) {
      return '<button class="navbtn" type="button" data-view="' + v[0] + '"' + (S.view === v[0] ? ' aria-current="page"' : '') + '>' + ICON[v[0]] + v[1] + (/semak|tarikh/.test(v[0]) ? '<span class="newtag">NEW</span>' : '') + '</button>';
    }).join('');
    $('[data-bnav]').innerHTML = VIEWS.filter(function (v) { return v[0] !== 'tahun'; }).map(function (v) {
      return '<button type="button" data-view="' + v[0] + '"' + (S.view === v[0] ? ' aria-current="page"' : '') + '>' + ICON[v[0]] + ({ semak: 'Check', tarikh: 'Countdown', senarai: 'Events' }[v[0]] || v[1]) + '</button>';
    }).join('') + '<button type="button" data-filtersm>' + ICON.tapis + 'Filter' + (Object.keys(S.off).filter(function (k) { return S.off[k]; }).length ? ' •' : '') + '</button>';

    var counts = {};

    }).join('');

      ? '<span class="who-l">Editor mode</span><span class="who-n">' + esc(S.sesi.nama) + '</span><button class="sbtn" type="button" data-logout>Sign out</button>'
      : '<span class="who-l">Public view</span><button class="sbtn" type="button" data-login>' + ICON.lock + 'Editor sign in</button>';

  function render() {

    else if (S.view === 'senarai') c.innerHTML = viewAgenda();
    else c.innerHTML = viewYear();
    $('[data-pager]').style.visibility = /senarai|semak|tarikh|langgan/.test(S.view) ? 'hidden' : 'visible';
    $('.search').style.visibility = /semak|langgan/.test(S.view) ? 'hidden' : 'visible';
    if (S.view === 'senarai' && !S.q && !S._scrolled) {
      S._scrolled = true;

  /* ── Bulan ── */
  function viewMonth(narrow) {
    var y = S.cursor.getFullYear(), m = S.cursor.getMonth();
    var first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
    var start = monStart(first), end = add(monStart(last), 6);
    var list = visible(), hol = holidaySet(), tdy = todayI();
    var MAX = 3;

    $('[data-title]').textContent = BULAN[m] + ' ' + y;
    var inMonth = list.filter(function (a) { return a.mula <= I(last) && a.tamat >= I(first); });
    var wkFirst = S.data.minggu.filter(function (w) { return w.mula >= I(start) && w.mula <= I(last) && w.minggu; });
    $('[data-subtitle]').innerHTML = '<span>' + inMonth.length + ' events</span>' +
      (wkFirst.length ? '<span class="pill">Week ' + esc(wkFirst[0].minggu) + (wkFirst.length > 1 ? '–' + esc(wkFirst[wkFirst.length - 1].minggu) : '') + '</span>' : '') +
      (S.q ? '<span class="pill">Search: “' + esc(S.q) + '”</span>' : '');

    var h = '<div class="cal" role="grid" aria-label="' + BULAN[m] + ' ' + y + '"><div class="dow"><div>Week</div>' +
      ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(function (d) { return '<div>' + (narrow ? d.slice(0, 3) : d) + '</div>'; }).join('') + '</div>';

    for (var ws = start; ws <= end; ws = add(ws, 7)) {
      var we = add(ws, 6), wsI = I(ws), weI = I(we);
      var wi = S.weekMap[wsI];
      var segs = list.filter(function (a) { return a.mula <= weI && a.tamat >= wsI; }).map(function (a) {
        var s = a.mula < wsI ? wsI : a.mula, e = a.tamat > weI ? weI : a.tamat;
        return { a: a, c0: days(wsI, s), c1: days(wsI, e), cl: a.mula < wsI, cr: a.tamat > weI };
      });
      segs.sort(function (p, q) { return p.c0 - q.c0 || (q.c1 - q.c0) - (p.c1 - p.c0); });
      var lanes = [];
      segs.forEach(function (s) {
        for (var L = 0; ; L++) { if ((lanes[L] == null ? -1 : lanes[L]) < s.c0) { lanes[L] = s.c1; s.lane = L; break; } }
      });
      var hidden = [0, 0, 0, 0, 0, 0, 0];
      segs.forEach(function (s) { if (s.lane >= MAX) for (var c = s.c0; c <= s.c1; c++) hidden[c]++; });
      // Jika satu hari hanya ada satu acara tersembunyi, tunjukkan "+1" juga (ringkas).

      h += '<div class="wk">';
      h += '<div class="wkl">' + (wi && wi.minggu ? '<span class="m">WK</span><span class="w">' + esc(wi.minggu) + '</span>' : '<span class="m">&nbsp;</span>') +
        (wi && wi.putaran ? '<span class="r' + (/2/.test(wi.putaran) ? ' t2' : '') + '">' + esc(wi.putaran) + '</span>' : '') + '</div>';
      if (wi && (wi.minggu || wi.putaran)) h += '<span class="wtag">' + (wi.minggu ? 'W' + esc(wi.minggu) : '') + (wi.putaran ? ' ' + esc(wi.putaran) : '') + '</span>';
      h += '<div class="wg"' + (narrow ? '' : ' style="grid-template-rows:30px repeat(' + (MAX + 1) + ',22px)"') + '>';
      for (var c = 0; c < 7; c++) {
        var d = add(ws, c), dI = I(d);
        var cls = ['dc'];
        if (d.getMonth() !== m) cls.push('out');
        if (c >= 5) cls.push('we');
        if (hol[dI]) cls.push('hol');
        if (dI === tdy) cls.push('today');
        if (narrow && dI === S.selDay) cls.push('sel');
        var dayEv = narrow ? onDay(list, dI) : [];
        h += '<div class="' + cls.join(' ') + '" style="grid-column:' + (c + 1) + '" data-day="' + dI + '" role="gridcell" aria-label="' + fmt(dI, 'long') + '"><span class="dn">' + d.getDate() + '</span>' +
          (narrow && dayEv.length ? '<span class="dots">' + dayEv.slice(0, 4).map(function (a) { return '<b style="--c:' + esc(catOf(a.kat).warna) + '"></b>'; }).join('') + '</span>' : '') + '</div>';
      }
      if (!narrow) {
        segs.forEach(function (s) {
          if (s.lane >= MAX) return;
          var multi = s.a.mula !== s.a.tamat;
          h += '<button class="bar' + (multi ? ' multi' : '') + (s.cl ? ' cl' : '') + (s.cr ? ' cr' : '') + '" type="button" data-ev="' + esc(s.a.id) + '" style="--c:' + esc(catOf(s.a.kat).warna) + ';grid-column:' + (s.c0 + 1) + ' / ' + (s.c1 + 2) + ';grid-row:' + (s.lane + 2) + '" title="' + esc(s.a.tajuk) + '"><span>' + hi(s.a.tajuk) + '</span></button>';
        });
        for (c = 0; c < 7; c++) if (hidden[c]) h += '<button class="more" type="button" data-day="' + I(add(ws, c)) + '" style="grid-column:' + (c + 1) + ';grid-row:' + (MAX + 2) + '">+' + hidden[c] + ' more</button>';
      }
      h += '</div></div>';
    }
    h += '</div>';

    if (narrow) {
      if (!S.selDay || S.selDay < I(first) || S.selDay > I(last)) S.selDay = (tdy >= I(first) && tdy <= I(last)) ? tdy : I(first);
      var de = onDay(list, S.selDay);
      var wi2 = weekInfo(S.selDay);
      h += '<div class="daypanel"><div class="ag-m"><h2>' + fmt(S.selDay, 'long') + '</h2>' + (wi2 && wi2.minggu ? '<span>Week ' + esc(wi2.minggu) + (wi2.putaran ? ' · ' + esc(wi2.putaran) : '') + '</span>' : '') + '</div><div style="height:12px"></div>' +
        (de.length ? '<div class="ag-d" style="grid-template-columns:1fr"><div class="ag-list">' + de.map(evRow).join('') + '</div></div>'
          : '<div class="empty"><b>No events</b>Tap another date on the calendar.' + (S.sesi ? '<div style="margin-top:12px"><button class="btn pri" type="button" data-addon="' + S.selDay + '">Add event</button></div>' : '') + '</div>') + '</div>';
    }
    return h;
  }

  function evRow(a) {

  /* ── Senarai ── */
  function viewAgenda() {
    var list = visible(), tdy = todayI();
    $('[data-title]').textContent = S.q ? 'Search results' : 'Events';
    $('[data-subtitle]').innerHTML = '<span>' + list.length + ' events</span>' + (S.q ? '<span class="pill">“' + esc(S.q) + '”</span>' : '<span class="pill">' + S.data.tetapan.tahun + '</span>');
    if (!list.length) return '<div class="empty"><b>No events found</b>Try another keyword or turn categories back on.</div>';
    var byDay = {}, order = [];

    order.sort();

    var h = '<div class="agenda">', lastM = '';

        (wi && wi.minggu ? '<span class="w" style="margin-top:6px;font-size:10px">W' + esc(wi.minggu) + '</span>' : '') + '</div><div class="ag-list">' + byDay[d].map(evRow).join('') + '</div></div>';
    });
    return h + '</div>';
  }

  /* ── Tahun ── */
  function viewYear() {
    var y = S.cursor.getFullYear(), list = visible(), hol = holidaySet(), tdy = todayI();
    $('[data-title]').textContent = 'Year ' + y;

          '<i>' + cats.slice(0, 3).map(function (k) { return '<b style="--c:' + esc(catOf(k).warna) + '"></b>'; }).join('') + '</i></button>';

  /* ═════════════ NEW: teacher features ═════════════ */
  function guessAud(a) {
    var t = a.tajuk.toUpperCase(), r = [];
    if (a.kat === 'cuti') return ['All'];
    if (/\b(Y|YR|YEAR) ?1\b|\bYR1\b|BATCH 2026\/2028/.test(t)) r.push('Y1');
    if (/\b(Y|YR|YEAR) ?2\b|\bYR2\b|\bY2\b|IB M27|IB MAY|EE SUBMISSION|TOK SUBMISSION|SUBMIT PG|DINNER BATCH|DIASPORA|HOSTEL CLEARANCE|VIVA VOCE/.test(t)) r.push('Y2');
    if (a.kat === 'staf' || /TEACHER|\bTOT\b|SENATE|MEETING|MESYUARAT|KURSUS|UPSKILLING|TOWN HALL|CERAMAH|AGM KOP|SUBMIT MARKS/.test(t)) r.push('Staff');
    return r.length ? r : ['All'];
  }
  function cdPill(a) {
    var b = baseDate(), n = days(b, a.mula), end = days(b, a.tamat);
    if (end < 0) return '<span class="cdn past">Passed</span>';
    if (n <= 0) return '<span class="cdn now">' + (a.mula === a.tamat ? 'Today' : 'Ongoing') + '</span>';
    return '<span class="cdn' + (n <= 14 ? ' soon' : '') + '">' + (n === 1 ? 'Tomorrow' : 'In ' + n + ' days') + '</span>';
  }
  function audChips(a) { return a.aud.map(function (x) { return '<span class="aud ' + (x === 'Y1' ? 'y1' : x === 'Y2' ? 'y2' : x === 'Staff' ? 'st' : '') + '">' + (x === 'All' ? 'Everyone' : x) + '</span>'; }).join(''); }
  function forGroup(a, g) { return g === 'Both' ? (a.aud.indexOf('Staff') < 0 || a.aud.length > 1 || a.aud[0] === 'All') : (a.aud.indexOf(g) >= 0 || a.aud.indexOf('All') >= 0); }
  function isTest(a) { return a.kat === 'nilai' && !/STUDY LEAVE|ENDS|STARTS|DEADLINE/i.test(a.tajuk) && days(a.mula, a.tamat) <= 4; }
  function holOn(dI) { return S.data.acara.filter(function (a) { return a.kat === 'cuti' && a.mula <= dI && a.tamat >= dI; }); }
  function baseDate() { return todayI(); }
  function ckDefault() { var t = todayI(), y = S.data.tetapan.tahun; return t.slice(0, 4) == y ? t : y + '-01-04'; }

  function assess(dI, g, kind) {
    var d = P(dI), on = onDay(S.data.acara, dI), R = [], score = 0;
    var hol = holOn(dI);
    if (hol.length) { R.push(['bad', hol[0].tajuk + (hol[0].mula !== hol[0].tamat ? ' (' + fmt(hol[0].mula) + ' – ' + fmt(hol[0].tamat) + ')' : '') + ' — no classes.']); score += 10; }
    if (d.getDay() === 0 || d.getDay() === 6) { R.push(['bad', 'It is a ' + HARI[d.getDay()] + '.']); score += 10; }
    var tests = on.filter(function (a) { return isTest(a) && forGroup(a, g); });
    if (tests.length) { R.push([kind === 'test' ? 'bad' : 'mid', tests.length + ' assessment' + (tests.length > 1 ? 's' : '') + ' already on this day for ' + (g === 'Both' ? 'students' : g) + ': ' + tests.map(function (a) { return a.tajuk; }).join(', ') + '.']); score += kind === 'test' ? 6 : 2; }
    var busy = on.filter(function (a) { return a.kat !== 'cuti' && !isTest(a) && forGroup(a, g) && days(a.mula, a.tamat) <= 4; });
    if (busy.length) { R.push(['mid', busy.length + ' other event' + (busy.length > 1 ? 's' : '') + ' for ' + (g === 'Both' ? 'students' : g) + ' (after class): ' + busy.map(function (a) { return a.tajuk; }).slice(0, 4).join(', ') + (busy.length > 4 ? '…' : '') + '.']); score += busy.length >= 3 ? 3 : 1; }
    var lng = on.filter(function (a) { return a.kat !== 'cuti' && days(a.mula, a.tamat) > 4 && forGroup(a, g); });
    lng.forEach(function (a) { var sl = /STUDY LEAVE|INDEPENDENT/i.test(a.tajuk); R.push([sl ? 'bad' : 'mid', 'Falls within ' + a.tajuk + '.']); score += sl ? 8 : 1; });
    var ws = monStart(d), wTests = S.data.acara.filter(function (a) { return isTest(a) && forGroup(a, g) && a.mula >= I(ws) && a.mula <= I(add(ws, 6)); });
    if (kind === 'test' && wTests.length >= 2) { R.push(['mid', (g === 'Both' ? 'Students' : g) + ' already have ' + wTests.length + ' assessments this week.']); score += 2; }
    var lvl = score >= 6 ? 'bad' : score >= 2 ? 'mid' : 'ok';
    return { lvl: lvl, score: score, R: R, tests: tests };
  }

  function viewCheck() {

    }

      (res.R.length ? '<div class="card"><h3>Why</h3><div class="cs">What is already on the calendar</div>' + res.R.map(function (r) { return '<div class="reason"><span class="dot" style="background:' + (r[0] === 'bad' ? '#B3261E' : '#C2720C') + '">!</span><span>' + esc(r[1]) + '</span></div>'; }).join('') + '</div>' : '') +
      (sug.length ? '<div class="card" style="margin-top:18px"><h3>Free days nearby</h3><div class="cs">No assessments or events for ' + (ck.g === 'Both' ? 'students' : ck.g) + ', not a holiday</div><div class="sugg">' + sug.map(function (dI) { var w2 = weekInfo(dI); return '<button type="button" data-ckday="' + dI + '">' + fmt(dI) + '<small>' + (w2 && w2.minggu ? 'Week ' + esc(w2.minggu) : '') + (w2 && w2.putaran ? ' · ' + esc(w2.putaran) : '') + '</small></button>'; }).join('') + '</div></div>' : '') +
      (res.lvl === 'ok' && S.sesi ? '<div style="margin-top:14px"><button class="btn pri" type="button" data-addon="' + ck.d + '">Add it to the calendar</button></div>' : '');
    return '<div class="ck"><div>' + left + strip + '</div><div>' + right + '</div></div>';
  }

  var DEADLINES = /SUBMIT|SUBMISSION|DEADLINE|SENATE|PRESCRIBED|REGISTRATION BRIEFING|VIVA VOCE STARTS|EXAM SEM|IB M27 BEGINS|IB MAY EXAM ENDS|EE REG/i;
  function viewDeadlines() {

    var up = L.filter(function (a) { return a.mula >= b; }), past = L.filter(function (a) { return a.mula < b; });

  function busy(btn, on, label) {

  function downloadIcs(only) {
    var list = Array.isArray(only) ? only : visible();
    var stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
    var fold = function (s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); };
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kolej MARA Banting//Calendar//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:' + fold(S.data.tetapan.nama), 'X-WR-TIMEZONE:Asia/Kuala_Lumpur'];
    list.forEach(function (a) {
      L.push('BEGIN:VEVENT', 'UID:' + a.id + '@takwim-kmb', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + a.mula.replace(/-/g, ''),
        'DTEND;VALUE=DATE:' + I(add(P(a.tamat), 1)).replace(/-/g, ''), 'SUMMARY:' + fold(a.tajuk), 'CATEGORIES:' + fold(catOf(a.kat).nama));
      if (a.ket) L.push('DESCRIPTION:' + fold(a.ket));
      L.push('END:VEVENT');
    });

    var blob = new Blob([L.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    var u = URL.createObjectURL(blob), el = document.createElement('a');
    el.href = u; el.download = Array.isArray(only) ? only[0].tajuk.replace(/[^\w]+/g, '_').slice(0, 40) + '.ics' : 'KMB_Calendar_' + S.data.tetapan.tahun + '.ics'; document.body.appendChild(el); el.click();
    setTimeout(function () { URL.revokeObjectURL(u); el.remove(); }, 500);
    toast(Array.isArray(only) ? 'Event saved. Open the file to add it to your calendar.' : list.length + ' events exported to .ics');
  }

  document.addEventListener('click', function (e) {

    if ('close' in d) return closeDlg();

    if (d.view) { S.view = d.view; S._scrolled = false; store('view', S.view); window.scrollTo(0, 0); return render(); }
    if (d.ev) return showEvent(d.ev);
    if (d.cat) { S.off[d.cat] = !S.off[d.cat]; store('off', S.off); render(); if ($('[data-layer] .dlg')) showFilters(); return; }
    if ('allcats' in d) { S.off = {}; store('off', S.off); render(); if ($('[data-layer] .dlg')) showFilters(); return; }
    if ('filtersm' in d) { menu.hidden = true; return showFilters(); }
    if (d.ics1) { var ev1 = S.data.acara.filter(function (x) { return x.id === d.ics1; })[0]; if (ev1) downloadIcs([ev1]); return; }
    if (d.ckg) { S.ck.g = d.ckg; return render(); }
    if (d.ckk) { S.ck.k = d.ckk; return render(); }
    if (d.ckday) { S.ck.d = d.ckday; S.view = 'semak'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (d.feed) { $$('[data-feed]').forEach(function (b) { b.classList.toggle('navy', b === t); }); $('[data-feedurl]').textContent = 'https://script.google.com/macros/s/…/exec?feed=ics&group=' + d.feed.toLowerCase(); return; }
    if ('prev' in d || 'next' in d) {
      var n = 'prev' in d ? -1 : 1;
      S.cursor = S.view === 'tahun' ? new Date(S.cursor.getFullYear() + n, 0, 1) : new Date(S.cursor.getFullYear(), S.cursor.getMonth() + n, 1);
      S.selDay = null; return render();
    }
    if ('today' in d) { var t0 = new Date(); S.cursor = new Date(t0.getFullYear(), t0.getMonth(), 1); S.selDay = todayI(); return render(); }
    if (d.gomonth != null) { S.cursor = new Date(S.cursor.getFullYear(), +d.gomonth, 1); S.view = 'bulan'; return render(); }
    if (d.yday) { var yd = P(d.yday); S.cursor = new Date(yd.getFullYear(), yd.getMonth(), 1); S.view = 'bulan'; S.selDay = d.yday; render(); if (!matchMedia('(max-width: 720px)').matches) showDay(d.yday); return; }

      if (matchMedia('(max-width: 720px)').matches && !t.classList.contains('more')) { S.selDay = d.day; render(); var dp = $('.daypanel'); if (dp) dp.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
      return showDay(d.day);
    }
    if ('login' in d) return showLogin();
    if ('logout' in d) return doLogout();
    if ('dologin' in d) return doLogin(t);
    if ('add' in d || 'fab' in d) return showForm({ mula: S.selDay || I(S.cursor) });
    if (d.addon) return showForm({ mula: d.addon });
    if (d.edit) return showForm(S.data.acara.filter(function (x) { return x.id === d.edit; })[0]);
    if (d.dup) { var src = S.data.acara.filter(function (x) { return x.id === d.dup; })[0]; return showForm({ tajuk: src.tajuk, mula: src.mula, tamat: src.tamat, kat: src.kat, ket: src.ket }); }
    if (d.del) return showEvent(d.del, true);
    if (d.dodel) return doDelete(d.dodel, t);
    if ('save' in d) return doSave(t);
    if (d.pick) { $$('[data-pick]').forEach(function (b) { b.setAttribute('aria-pressed', b === t); }); $('[data-form]').kat.value = d.pick; return; }
    if ('ics' in d) { menu.hidden = true; return downloadIcs(null); }
    if ('print' in d) { menu.hidden = true; return setTimeout(function () { window.print(); }, 50); }
    if ('reload' in d) { menu.hidden = true; return load(true); }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.matches('[data-loginform]')) doLogin($('[data-dologin]'));
    if (e.target.matches('[data-form]')) doSave($('[data-save]'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if ($('[data-layer] .dlg')) closeDlg(); else $('[data-menu]').hidden = true; }
    if (e.key === 'Enter' && e.target.matches('[data-form] input')) { e.preventDefault(); doSave($('[data-save]')); }
    if ($('[data-layer] .dlg') || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !S.data) return;
    if (e.key === 'ArrowLeft') $('[data-prev]').click();
    if (e.key === 'ArrowRight') $('[data-next]').click();
  });

  document.addEventListener('change', function (e) { if (e.target.matches('[data-ckd]') && e.target.value) { S.ck.d = e.target.value; render(); } });
  var qt;
  $('[data-q]').addEventListener('input', function (e) {
    clearTimeout(qt);
    qt = setTimeout(function () {
      S.q = e.target.value.trim(); $('[data-qx]').hidden = !S.q;
      if (S.q && S.view === 'bulan' && matchMedia('(max-width: 720px)').matches) S.view = 'senarai';
      if (S.data) render();
    }, 160);
  });
  $('[data-qx]').addEventListener('click', function (e) { e.preventDefault(); $('[data-q]').value = ''; S.q = ''; this.hidden = true; render(); });

  var lastNarrow = matchMedia('(max-width: 720px)').matches;
  window.addEventListener('resize', function () {
    var n = matchMedia('(max-width: 720px)').matches;
    if (n !== lastNarrow && S.data) { lastNarrow = n; render(); }
  });

  /* ═════════════ Mula ═════════════ */
  S.view = 'bulan';
  S.off = store('off') || {};
  var tok = sess('tok');
  if (tok) {
    S.sesi = { nama: sess('nama') || '' };
    call('semakSesi', [tok]).then(function (r) { if (!r) { S.sesi = null; sess('tok', null); } else S.sesi = r; if (S.data) renderChrome(); }, function () {});
  }
  if (PREVIEW) {
    var n = document.createElement('div'); n.className = 'notice';
    n.innerHTML = '<b>Preview.</b>&nbsp;Changes are not saved to Google Sheets. Demo editor PIN: <b>2027</b>';
    $('[data-content]').parentNode.insertBefore(n, $('[data-content]'));
    n.style.margin = matchMedia('(max-width: 900px)').matches ? '12px 12px 0' : '16px 28px 0';
  }
  load();
})();
</script>
</body>
</html>
